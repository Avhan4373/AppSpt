<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Anda Sedang Offline • AppSPT</title>
    <style>
      :root { --primary: #0ea5e9; --fg: #0f172a; --muted: #64748b; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; color: var(--fg); background: #f8fafc; display: grid; place-items: center; min-height: 100vh; }
      .card { width: min(560px, 92vw); background: white; border-radius: 14px; box-shadow: 0 6px 24px rgba(2,6,23,.08); padding: 28px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0.25rem 0; color: var(--muted); }
      .hint { margin-top: 14px; font-size: .925rem; }
      .btn { display: inline-block; margin-top: 18px; padding: 10px 14px; background: var(--primary); color: white; border-radius: 10px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Anda sedang offline</h1>
      <p>Beberapa data mungkin tidak tampil. Silakan periksa koneksi internet Anda.</p>
      <p class="hint">Halaman ini disediakan oleh aplikasi untuk mode offline.</p>
      <a class="btn" href="/">Coba Muat Ulang</a>
    </main>
  </body>
  </html>
